name: Build APK RR MOTOR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o RR_MOTOR_COMPLETE.zip -d project

      - name: Show Android configuration
        run: |
          echo "===== APP BUILD GRADLE ====="
          cat project/app/build.gradle
          echo ""
          echo "===== MANIFEST ====="
          cat project/app/src/main/AndroidManifest.xml

      - name: Find Java and Kotlin files
        run: |
          echo "===== JAVA ====="
          find project -type f -name "*.java" -print
          echo ""
          echo "===== KOTLIN ====="
          find project -type f -name "*.kt" -print

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RR-MOTOR-APK
          path: project/**/build/outputs/apk/debug/*.apk
