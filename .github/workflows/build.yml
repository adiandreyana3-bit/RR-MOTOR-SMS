name: Build APK RR MOTOR FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build RR MOTOR
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================================
      # 3. GRADLE
      # ==========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ==========================================================
      # 4. BUAT STRUKTUR PROJECT
      # ==========================================================

      - name: Create Android project
        shell: bash
        run: |

          set -e

          mkdir -p app/src/main/java/com/rrmotor/sms
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi


      # ==========================================================
      # 5. SETTINGS.GRADLE
      # ==========================================================

      - name: Create settings.gradle
        shell: bash
        run: |

          cat > settings.gradle <<'EOF'

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RR-MOTOR-SMS"

          include(":app")

          EOF


      # ==========================================================
      # 6. ROOT BUILD.GRADLE
      # ==========================================================

      - name: Create root build.gradle
        shell: bash
        run: |

          cat > build.gradle <<'EOF'

          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }

          EOF


      # ==========================================================
      # 7. GRADLE PROPERTIES
      # ==========================================================

      - name: Create gradle.properties
        shell: bash
        run: |

          cat > gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          android.useAndroidX=true

          android.nonTransitiveRClass=true

          EOF


      # ==========================================================
      # 8. APP BUILD.GRADLE
      # ==========================================================

      - name: Create app build.gradle
        shell: bash
        run: |

          cat > app/build.gradle <<'EOF'

          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.rrmotor.sms'

              compileSdk 35

              defaultConfig {

                  applicationId "com.rrmotor.sms"

                  minSdk 23

                  targetSdk 35

                  versionCode 3

                  versionName "3.0"

              }

              buildTypes {

                  release {

                      minifyEnabled false

                      shrinkResources false

                  }

              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17

              }

          }

          EOF


      # ==========================================================
      # 9. MANIFEST
      # ==========================================================

      - name: Create AndroidManifest.xml
        shell: bash
        run: |

          cat > app/src/main/AndroidManifest.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-permission
                  android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application

                  android:allowBackup="true"

                  android:label="RR MOTOR"

                  android:supportsRtl="true"

                  android:theme="@style/AppTheme">

                  <activity

                      android:name=".MainActivity"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>


                  <receiver

                      android:name=".ReminderReceiver"

                      android:exported="false" />


                  <receiver

                      android:name=".BootReceiver"

                      android:enabled="true"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.BOOT_COMPLETED" />

                          <action
                              android:name="android.intent.action.MY_PACKAGE_REPLACED" />

                      </intent-filter>

                  </receiver>

              </application>

          </manifest>

          EOF


      # ==========================================================
      # 10. STRINGS
      # ==========================================================

      - name: Create strings.xml
        shell: bash
        run: |

          cat > app/src/main/res/values/strings.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">RR MOTOR</string>

          </resources>

          EOF


      # ==========================================================
      # 11. COLORS
      # ==========================================================

      - name: Create colors.xml
        shell: bash
        run: |

          cat > app/src/main/res/values/colors.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <color name="rr_green">#128C7E</color>

              <color name="rr_dark">#075E54</color>

              <color name="white">#FFFFFF</color>

              <color name="black">#000000</color>

              <color name="gray">#777777</color>

          </resources>

          EOF


      # ==========================================================
      # 12. THEME
      # ==========================================================

      - name: Create themes.xml
        shell: bash
        run: |

          cat > app/src/main/res/values/themes.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item
                      name="android:colorAccent">
                      @color/rr_green
                  </item>

                  <item
                      name="android:statusBarColor">
                      @color/rr_dark
                  </item>

                  <item
                      name="android:navigationBarColor">
                      @color/white
                  </item>

              </style>

          </resources>

          EOF


      # ==========================================================
      # 13. MAIN ACTIVITY
      # ==========================================================

      - name: Create MainActivity.java
        shell: bash
        run: |

          cat > app/src/main/java/com/rrmotor/sms/MainActivity.java <<'EOF'

          package com.rrmotor.sms;


          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;


          import org.json.JSONArray;
          import org.json.JSONObject;


          import java.text.SimpleDateFormat;

          import java.util.ArrayList;

          import java.util.Date;

          import java.util.Locale;


          public class MainActivity extends Activity {


              public static final String PREF =
                      "RR_MOTOR_DATA";


              public static final String DATA =
                      "REMINDER_LIST";


              private EditText nama;

              private EditText mesin;

              private EditText km;

              private EditText nopol;

              private EditText wa;

              private EditText pesan;


              private LinearLayout riwayat;

              private TextView jumlah;


              private SharedPreferences pref;


              private final ArrayList<Reminder>
                      list =
                      new ArrayList<>();


              private String template() {

                  return

                      "🏍️ *RR MOTOR*\\n\\n" +

                      "🎁 *PENGECEKAN OLI GRATIS!* 🎁\\n\\n" +

                      "Halo [SAPaan] 👋\\n\\n" +

                      "Kami dari *RR MOTOR* ingin mengingatkan bahwa kendaraan Anda sudah memasuki jadwal pengecekan/penggantian oli. 🔧\\n\\n" +

                      "✨ *Pengecekan kondisi oli GRATIS!*\\n\\n" +

                      "Silakan datang ke *RR MOTOR* untuk pengecekan kondisi oli dan kendaraan Anda.\\n\\n" +

                      "Jangan tunggu sampai terlambat agar mesin tetap nyaman dan terawat. 😊\\n\\n" +

                      "Kami tunggu kedatangannya di *RR MOTOR*.\\n\\n" +

                      "Terima kasih 🙏\\n" +

                      "*RR MOTOR*";

              }


              @Override

              protected void onCreate(Bundle b) {

                  super.onCreate(b);

                  setContentView(
                          R.layout.activity_main
                  );


                  pref =
                      getSharedPreferences(
                          PREF,
                          MODE_PRIVATE
                      );


                  nama =
                      findViewById(R.id.nama);

                  mesin =
                      findViewById(R.id.mesin);

                  km =
                      findViewById(R.id.km);

                  nopol =
                      findViewById(R.id.nopol);

                  wa =
                      findViewById(R.id.wa);

                  pesan =
                      findViewById(R.id.pesan);


                  riwayat =
                      findViewById(
                          R.id.riwayat
                      );


                  jumlah =
                      findViewById(
                          R.id.jumlah
                      );


                  Button simpan =
                      findViewById(
                          R.id.simpan
                      );


                  Button buka =
                      findViewById(
                          R.id.buka
                      );


                  pesan.setText(
                      template()
                  );


                  load();

                  updateJumlah();


                  simpan.setOnClickListener(
                      v -> save()
                  );


                  buka.setOnClickListener(
                      v -> {

                          riwayat.setVisibility(
                              riwayat.getVisibility()
                              == View.VISIBLE
                              ? View.GONE
                              : View.VISIBLE
                          );

                          showHistory();

                      }
                  );


                  if (
                      android.os.Build.VERSION.SDK_INT
                      >= 33
                  ) {

                      if (
                          checkSelfPermission(
                              Manifest.permission.POST_NOTIFICATIONS
                          )
                          != PackageManager.PERMISSION_GRANTED
                      ) {

                          requestPermissions(

                              new String[] {
                                  Manifest.permission.POST_NOTIFICATIONS
                              },

                              100

                          );

                      }

                  }

              }


              private void save() {


                  String namaText =
                      nama.getText()
                          .toString()
                          .trim();


                  String mesinText =
                      mesin.getText()
                          .toString()
                          .trim();


                  String kmText =
                      km.getText()
                          .toString()
                          .trim();


                  String nopolText =
                      nopol.getText()
                          .toString()
                          .trim();


                  String waText =
                      wa.getText()
                          .toString()
                          .trim();


                  if (
                      TextUtils.isEmpty(
                          waText
                      )
                  ) {

                      wa.setError(
                          "Nomor WhatsApp wajib diisi"
                      );

                      wa.requestFocus();

                      return;

                  }


                  String pesanText =
                      pesan.getText()
                          .toString()
                          .trim();


                  if (
                      TextUtils.isEmpty(
                          pesanText
                      )
                  ) {

                      pesanText =
                          template();

                  }


                  Reminder r =
                      new Reminder();


                  r.id =
                      System.currentTimeMillis();


                  r.nama =
                      namaText;


                  r.mesin =
                      mesinText;


                  r.km =
                      kmText;


                  r.nopol =
                      nopolText;


                  r.wa =
                      normalize(
                          waText
                      );


                  r.pesan =
                      makeMessage(
                          pesanText,
                          namaText
                      );


                  r.tanggal =
                      now();


                  r.jatuhTempo =
                      System.currentTimeMillis()
                      +
                      (31L * 24L * 60L * 60L * 1000L);


                  r.notified =
                      false;


                  list.add(
                      0,
                      r
                  );


                  saveData();


                  ReminderScheduler.schedule(
                      this,
                      r
                  );


                  updateJumlah();


                  showHistory();


                  Toast.makeText(

                      this,

                      "Reminder tersimpan. Notifikasi akan muncul setelah 31 hari.",

                      Toast.LENGTH_LONG

                  ).show();


                  nama.setText("");

                  mesin.setText("");

                  km.setText("");

                  nopol.setText("");

                  wa.setText("");

                  pesan.setText(
                      template()
                  );

              }


              private String makeMessage(
                  String text,
                  String customer
              ) {


                  String sapaan;


                  if (
                      TextUtils.isEmpty(
                          customer
                      )
                  ) {

                      sapaan =
                          "Bapak/Ibu";

                  } else {

                      sapaan =
                          "Bapak/Ibu " +
                          customer;

                  }


                  return text.replace(
                      "[SAPaan]",
                      sapaan
                  );

              }


              private String normalize(
                  String number
              ) {


                  number =
                      number.replaceAll(
                          "[^0-9+]",
                          ""
                      );


                  if (
                      number.startsWith("08")
                  ) {

                      return "+62" +
                          number.substring(1);

                  }


                  if (
                      number.startsWith("8")
                  ) {

                      return "+62" +
                          number;

                  }


                  if (
                      number.startsWith("62")
                  ) {

                      return "+" +
                          number;

                  }


                  return number;

              }


              private String now() {

                  return new SimpleDateFormat(
                      "dd-MM-yyyy HH:mm",
                      Locale.getDefault()
                  ).format(
                      new Date()
                  );

              }


              private void showHistory() {


                  riwayat.removeAllViews();


                  if (
                      list.isEmpty()
                  ) {

                      TextView empty =
                          new TextView(this);

                      empty.setText(
                          "Belum ada reminder."
                      );

                      empty.setPadding(
                          10,
                          20,
                          10,
                          20
                      );

                      riwayat.addView(
                          empty
                      );

                      return;

                  }


                  LayoutInflater inflater =
                      LayoutInflater.from(
                          this
                      );


                  for (
                      Reminder r :
                      list
                  ) {


                      View item =
                          inflater.inflate(
                              R.layout.item_reminder,
                              riwayat,
                              false
                          );


                      TextView info =
                          item.findViewById(
                              R.id.info
                          );


                      Button kirim =
                          item.findViewById(
                              R.id.kirim
                          );


                      Button hapus =
                          item.findViewById(
                              R.id.hapus
                          );


                      StringBuilder s =
                          new StringBuilder();


                      if (
                          !TextUtils.isEmpty(
                              r.nama
                          )
                      ) {

                          s.append(
                              "Nama: "
                          )
                          .append(
                              r.nama
                          )
                          .append(
                              "\\n"
                          );

                      }


                      if (
                          !TextUtils.isEmpty(
                              r.nopol
                          )
                      ) {

                          s.append(
                              "Nopol: "
                          )
                          .append(
                              r.nopol
                          )
                          .append(
                              "\\n"
                          );

                      }


                      if (
                          !TextUtils.isEmpty(
                              r.mesin
                          )
                      ) {

                          s.append(
                              "No. Mesin: "
                          )
                          .append(
                              r.mesin
                          )
                          .append(
                              "\\n"
                          );

                      }


                      if (
                          !TextUtils.isEmpty(
                              r.km
                          )
                      ) {

                          s.append(
                              "KM: "
                          )
                          .append(
                              r.km
                          )
                          .append(
                              "\\n"
                          );

                      }


                      s.append(
                          "WA: "
                      )
                      .append(
                          r.wa
                      )
                      .append(
                          "\\n"
                      );


                      s.append(
                          "Disimpan: "
                      )
                      .append(
                          r.tanggal
                      )
                      .append(
                          "\\n"
                      );


                      s.append(
                          "Jatuh tempo: "
                      )
                      .append(
                          new SimpleDateFormat(
                              "dd-MM-yyyy HH:mm",
                              Locale.getDefault()
                          ).format(
                              new Date(
                                  r.jatuhTempo
                              )
                          )
                      );


                      info.setText(
                          s.toString()
                      );


                      kirim.setOnClickListener(
                          v ->
                              sendWhatsApp(r)
                      );


                      hapus.setOnClickListener(
                          v -> {

                              list.remove(r);

                              saveData();

                              ReminderScheduler.cancel(
                                  this,
                                  r.id
                              );

                              updateJumlah();

                              showHistory();

                          }
                      );


                      riwayat.addView(
                          item
                      );

                  }

              }


              private void sendWhatsApp(
                  Reminder r
              ) {


                  String number =
                      r.wa;


                  if (
                      number.startsWith("+")
                  ) {

                      number =
                          number.substring(
                              1
                          );

                  }


                  try {


                      Uri uri =
                          Uri.parse(

                              "https://wa.me/" +

                              number +

                              "?text=" +

                              Uri.encode(
                                  r.pesan
                              )

                          );


                      Intent intent =
                          new Intent(
                              Intent.ACTION_VIEW,
                              uri
                          );


                      startActivity(
                          intent
                      );


                  } catch (
                      Exception e
                  ) {


                      Toast.makeText(

                          this,

                          "WhatsApp tidak ditemukan.",

                          Toast.LENGTH_LONG

                      ).show();

                  }

              }


              private void updateJumlah() {

                  jumlah.setText(
                      "Jumlah reminder: " +
                      list.size()
                  );

              }


              private void saveData() {


                  try {


                      JSONArray array =
                          new JSONArray();


                      for (
                          Reminder r :
                          list
                      ) {


                          JSONObject o =
                              new JSONObject();


                          o.put(
                              "id",
                              r.id
                          );

                          o.put(
                              "nama",
                              r.nama
                          );

                          o.put(
                              "mesin",
                              r.mesin
                          );

                          o.put(
                              "km",
                              r.km
                          );

                          o.put(
                              "nopol",
                              r.nopol
                          );

                          o.put(
                              "wa",
                              r.wa
                          );

                          o.put(
                              "pesan",
                              r.pesan
                          );

                          o.put(
                              "tanggal",
                              r.tanggal
                          );

                          o.put(
                              "jatuhTempo",
                              r.jatuhTempo
                          );

                          o.put(
                              "notified",
                              r.notified
                          );


                          array.put(o);

                      }


                      pref.edit()

                          .putString(
                              DATA,
                              array.toString()
                          )

                          .apply();


                  } catch (
                      Exception e
                  ) {

                      e.printStackTrace();

                  }

              }


              private void load() {


                  list.clear();


                  String data =
                      pref.getString(
                          DATA,
                          ""
                      );


                  if (
                      TextUtils.isEmpty(
                          data
                      )
                  ) {

                      return;

                  }


                  try {


                      JSONArray array =
                          new JSONArray(
                              data
                          );


                      for (
                          int i = 0;
                          i < array.length();
                          i++
                      ) {


                          JSONObject o =
                              array.getJSONObject(i);


                          Reminder r =
                              new Reminder();


                          r.id =
                              o.optLong(
                                  "id"
                              );


                          r.nama =
                              o.optString(
                                  "nama"
                              );


                          r.mesin =
                              o.optString(
                                  "mesin"
                              );


                          r.km =
                              o.optString(
                                  "km"
                              );


                          r.nopol =
                              o.optString(
                                  "nopol"
                              );


                          r.wa =
                              o.optString(
                                  "wa"
                              );


                          r.pesan =
                              o.optString(
                                  "pesan"
                              );


                          r.tanggal =
                              o.optString(
                                  "tanggal"
                              );


                          r.jatuhTempo =
                              o.optLong(
                                  "jatuhTempo"
                              );


                          r.notified =
                              o.optBoolean(
                                  "notified",
                                  false
                              );


                          list.add(r);

                      }


                  } catch (
                      Exception e
                  ) {

                      e.printStackTrace();

                  }

              }


              public static class Reminder {


                  long id;


                  String nama;

                  String mesin;

                  String km;

                  String nopol;

                  String wa;

                  String pesan;

                  String tanggal;


                  long jatuhTempo;


                  boolean notified;

              }

          }

          EOF


      # ==========================================================
      # 14. REMINDER SCHEDULER
      # ==========================================================

      - name: Create ReminderScheduler.java
        shell: bash
        run: |

          cat > app/src/main/java/com/rrmotor/sms/ReminderScheduler.java <<'EOF'

          package com.rrmotor.sms;


          import android.app.AlarmManager;

          import android.app.PendingIntent;

          import android.content.Context;

          import android.content.Intent;

          import android.os.Build;


          public class ReminderScheduler {


              public static void schedule(

                  Context context,

                  MainActivity.Reminder reminder

              ) {


                  AlarmManager alarm =
                      (AlarmManager)
                      context.getSystemService(
                          Context.ALARM_SERVICE
                      );


                  Intent intent =
                      new Intent(
                          context,
                          ReminderReceiver.class
                      );


                  intent.putExtra(
                      "id",
                      reminder.id
                  );


                  PendingIntent pending =
                      PendingIntent.getBroadcast(

                          context,

                          (int)
                          (reminder.id & 0x7fffffff),

                          intent,

                          PendingIntent.FLAG_UPDATE_CURRENT
                          |
                          PendingIntent.FLAG_IMMUTABLE

                      );


                  if (
                      Build.VERSION.SDK_INT >= 23
                  ) {

                      alarm.setAndAllowWhileIdle(

                          AlarmManager.RTC_WAKEUP,

                          reminder.jatuhTempo,

                          pending

                      );

                  } else {

                      alarm.set(

                          AlarmManager.RTC_WAKEUP,

                          reminder.jatuhTempo,

                          pending

                      );

                  }

              }


              public static void cancel(

                  Context context,

                  long id

              ) {


                  AlarmManager alarm =
                      (AlarmManager)
                      context.getSystemService(
                          Context.ALARM_SERVICE
                      );


                  Intent intent =
                      new Intent(
                          context,
                          ReminderReceiver.class
                      );


                  PendingIntent pending =
                      PendingIntent.getBroadcast(

                          context,

                          (int)
                          (id & 0x7fffffff),

                          intent,

                          PendingIntent.FLAG_UPDATE_CURRENT
                          |
                          PendingIntent.FLAG_IMMUTABLE

                      );


                  alarm.cancel(
                      pending
                  );

              }

          }

          EOF


      # ==========================================================
      # 15. REMINDER RECEIVER
      # ==========================================================

      - name: Create ReminderReceiver.java
        shell: bash
        run: |

          cat > app/src/main/java/com/rrmotor/sms/ReminderReceiver.java <<'EOF'

          package com.rrmotor.sms;


          import android.app.NotificationChannel;

          import android.app.NotificationManager;

          import android.app.PendingIntent;

          import android.content.BroadcastReceiver;

          import android.content.Context;

          import android.content.Intent;

          import android.os.Build;


          public class ReminderReceiver
              extends BroadcastReceiver {


              private static final String CHANNEL =
                  "RR_MOTOR_REMINDER";


              @Override
              public void onReceive(

                  Context context,

                  Intent intent

              ) {


                  long id =
                      intent.getLongExtra(
                          "id",
                          -1
                      );


                  if (id == -1) {

                      return;

                  }


                  android.content.SharedPreferences pref =

                      context.getSharedPreferences(

                          MainActivity.PREF,

                          Context.MODE_PRIVATE

                      );


                  String data =
                      pref.getString(
                          MainActivity.DATA,
                          ""
                      );


                  try {


                      org.json.JSONArray array =
                          new org.json.JSONArray(
                              data
                          );


                      for (
                          int i = 0;
                          i < array.length();
                          i++
                      ) {


                          org.json.JSONObject o =
                              array.getJSONObject(i);


                          if (
                              o.optLong("id")
                              != id
                          ) {

                              continue;

                          }


                          boolean notified =
                              o.optBoolean(
                                  "notified",
                                  false
                              );


                          if (notified) {

                              return;

                          }


                          o.put(
                              "notified",
                              true
                          );


                          array.put(
                              i,
                              o
                          );


                          pref.edit()

                              .putString(
                                  MainActivity.DATA,
                                  array.toString()
                              )

                              .apply();


                          showNotification(
                              context,
                              o.optString(
                                  "nama"
                              )
                          );


                          break;

                      }


                  } catch (
                      Exception e
                  ) {

                      e.printStackTrace();

                  }

              }


              private void showNotification(

                  Context context,

                  String nama

              ) {


                  NotificationManager manager =

                      (NotificationManager)
                      context.getSystemService(
                          Context.NOTIFICATION_SERVICE
                      );


                  if (
                      Build.VERSION.SDK_INT >= 26
                  ) {


                      NotificationChannel channel =
                          new NotificationChannel(

                              CHANNEL,

                              "RR MOTOR Reminder",

                              NotificationManager.IMPORTANCE_HIGH

                          );


                      manager.createNotificationChannel(
                          channel
                      );

                  }


                  Intent open =
                      new Intent(
                          context,
                          MainActivity.class
                      );


                  PendingIntent pending =
                      PendingIntent.getActivity(

                          context,

                          999,

                          open,

                          PendingIntent.FLAG_UPDATE_CURRENT
                          |
                          PendingIntent.FLAG_IMMUTABLE

                      );


                  String title =
                      "🔔 RR MOTOR";


                  String text;


                  if (
                      nama == null ||
                      nama.isEmpty()
                  ) {

                      text =
                          "Sudah waktunya mengingatkan pelanggan untuk pengecekan oli.";

                  } else {

                      text =
                          "Reminder " +
                          nama +
                          " sudah jatuh tempo.";

                  }


                  android.app.Notification.Builder builder;


                  if (
                      Build.VERSION.SDK_INT >= 26
                  ) {

                      builder =
                          new android.app.Notification.Builder(

                              context,

                              CHANNEL

                          );

                  } else {

                      builder =
                          new android.app.Notification.Builder(
                              context
                          );

                  }


                  builder

                      .setSmallIcon(
                          android.R.drawable.ic_dialog_info
                      )

                      .setContentTitle(
                          title
                      )

                      .setContentText(
                          text
                      )

                      .setAutoCancel(
                          true
                      )

                      .setContentIntent(
                          pending
                      );


                  manager.notify(

                      (int)
                      (System.currentTimeMillis()
                      & 0x7fffffff),

                      builder.build()

                  );

              }

          }

          EOF


      # ==========================================================
      # 16. BOOT RECEIVER
      # ==========================================================

      - name: Create BootReceiver.java
        shell: bash
        run: |

          cat > app/src/main/java/com/rrmotor/sms/BootReceiver.java <<'EOF'

          package com.rrmotor.sms;


          import android.content.BroadcastReceiver;

          import android.content.Context;

          import android.content.Intent;


          import org.json.JSONArray;

          import org.json.JSONObject;


          public class BootReceiver
              extends BroadcastReceiver {


              @Override
              public void onReceive(

                  Context context,

                  Intent intent

              ) {


                  if (
                      Intent.ACTION_BOOT_COMPLETED.equals(
                          intent.getAction()
                      )
                      ||
                      Intent.ACTION_MY_PACKAGE_REPLACED.equals(
                          intent.getAction()
                      )
                  ) {


                      android.content.SharedPreferences pref =

                          context.getSharedPreferences(

                              MainActivity.PREF,

                              Context.MODE_PRIVATE

                          );


                      String data =
                          pref.getString(
                              MainActivity.DATA,
                              ""
                          );


                      try {


                          JSONArray array =
                              new JSONArray(
                                  data
                              );


                          long now =
                              System.currentTimeMillis();


                          for (
                              int i = 0;
                              i < array.length();
                              i++
                          ) {


                              JSONObject o =
                                  array.getJSONObject(i);


                              boolean notified =
                                  o.optBoolean(
                                      "notified",
                                      false
                                  );


                              long due =
                                  o.optLong(
                                      "jatuhTempo",
                                      0
                                  );


                              long id =
                                  o.optLong(
                                      "id",
                                      0
                                  );


                              if (
                                  !notified &&
                                  due > now
                              ) {


                                  MainActivity.Reminder r =
                                      new MainActivity.Reminder();


                                  r.id =
                                      id;


                                  r.jatuhTempo =
                                      due;


                                  ReminderScheduler.schedule(
                                      context,
                                      r
                                  );

                              }

                          }


                      } catch (
                          Exception e
                      ) {

                          e.printStackTrace();

                      }

                  }

              }

          }

          EOF


