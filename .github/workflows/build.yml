name: Build APK RR MOTOR FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK RR MOTOR
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. AMBIL SOURCE CODE
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. BUAT SETTINGS.GRADLE YANG BENAR
      # ==========================================
      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.PREFER_SETTINGS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "RR-MOTOR-SMS"

          include(":app")
          EOF


      # ==========================================
      # 4. ROOT BUILD.GRADLE
      # ==========================================
      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


      # ==========================================
      # 5. GRADLE PROPERTIES
      # ==========================================
      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


      # ==========================================
      # 6. PASTIKAN FOLDER APP ADA
      # ==========================================
      - name: Check Android project
        shell: bash
        run: |
          set -e

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml tidak ditemukan."
            exit 1
          fi

          echo "======================================"
          echo "PROJECT RR MOTOR DITEMUKAN"
          echo "======================================"

          ls -la
          ls -la app


      # ==========================================
      # 7. PERBAIKI APP BUILD.GRADLE
      # ==========================================
      - name: Configure Android app
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.rrmotor.sms'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.rrmotor.sms'

                  minSdk 23

                  targetSdk 35

                  versionCode 10

                  versionName '10.0'
              }

              buildTypes {
                  debug {
                      debuggable true
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                      debuggable false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.15.0'
          }
          EOF


      # ==========================================
      # 8. PASTIKAN MANIFEST ANDROID 15
      # ==========================================
      - name: Check AndroidManifest
        shell: bash
        run: |
          set -e

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "AndroidManifest.xml tidak ditemukan."
            exit 1
          fi

          echo "AndroidManifest.xml OK"


      # ==========================================
      # 9. INSTALL GRADLE
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'


      # ==========================================
      # 10. BUAT GRADLE WRAPPER
      # ==========================================
      - name: Create Gradle Wrapper
        shell: bash
        run: |
          set -e

          gradle wrapper \
            --gradle-version 8.10.2 \
            --distribution-type bin

          chmod +x gradlew

          echo "======================================"
          echo "GRADLE WRAPPER BERHASIL DIBUAT"
          echo "======================================"

          ls -la gradlew


      # ==========================================
      # 11. CEK GRADLE
      # ==========================================
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          ./gradlew --version


      # ==========================================
      # 12. CLEAN
      # ==========================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          ./gradlew clean --no-daemon


      # ==========================================
      # 13. BUILD DEBUG APK
      #
      # DEBUG DIPILIH AGAR LANGSUNG BISA
      # DI-INSTALL DI HP ANDROID 15
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 14. CEK APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "APK YANG DIHASILKAN:"
          echo "======================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          if ! find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | grep -q ".apk"; then

            echo "ERROR: APK TIDAK DITEMUKAN"

            exit 1
          fi


      # ==========================================
      # 15. SIAPKAN APK FINAL
      # ==========================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi

          echo "APK sumber:"
          echo "$APK"

          cp "$APK" \
            release/RR-MOTOR-FINAL-APK.apk

          echo ""
          echo "APK FINAL:"
          ls -lh release/RR-MOTOR-FINAL-APK.apk


      # ==========================================
      # 16. UPLOAD APK
      # ==========================================
      - name: Upload APK RR MOTOR
        uses: actions/upload-artifact@v4
        with:
          name: RR-MOTOR-FINAL-APK
          path: release/RR-MOTOR-FINAL-APK.apk
          if-no-files-found: error
          retention-days: 30
