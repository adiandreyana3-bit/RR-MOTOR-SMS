              // =====================================================
              // SEMUA RIWAYAT
              // =====================================================

              void tampilkanSemua() {

                  if (historyLayout ==
                          null) {

                      return;
                  }


                  historyLayout.removeAllViews();


                  String semua =
                          pref.getString(
                                  "RIWAYAT",
                                  "");


                  if (semua.isEmpty()) {

                      TextView t =
                              new TextView(this);

                      t.setText(
                              "Belum ada riwayat servis.");

                      historyLayout.addView(t);

                      return;
                  }


                  for (String baris :
                          semua.split("\n")) {

                      tampilkanBaris(
                              baris);
                  }
              }


