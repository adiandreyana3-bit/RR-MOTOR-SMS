name: Build APK RR MOTOR FINAL

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Extract project
    run: |
      rm -rf project
      unzip -o RR_MOTOR_COMPLETE.zip -d project

  - name: Prepare Android resources
    run: |
      mkdir -p project/app/src/main/res/drawable
      mkdir -p project/app/src/main/res/xml

  - name: Install RR MOTOR icon
    run: |
      if [ -f rr_motor_icon.png ]; then
        cp rr_motor_icon.png project/app/src/main/res/drawable/rr_motor_icon.png
      else
        echo "Icon tidak ditemukan, lanjut."
      fi

  - name: Check source files
    run: |
      echo "===== JAVA ====="
      find project -type f -name "*.java" -print || true
      echo "===== KOTLIN ====="
      find project -type f -name "*.kt" -print || true

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"
      cache: gradle

  - name: Build APK
    working-directory: project
    run: |
      chmod +x gradlew
      ./gradlew clean assembleDebug --no-daemon --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: RR-MOTOR-FINAL-APK
      path: project/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
```
