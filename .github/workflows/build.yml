name: Build APK RR MOTOR FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: rr-motor-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf project
          mkdir -p project
          unzip -o RR_MOTOR_COMPLETE.zip -d project

      - name: Check source files
        run: |
          echo "===== FILE JAVA ====="
          find project -type f -name "*.java" -print || true
          echo "===== FILE KOTLIN ====="
          find project -type f -name "*.kt" -print || true

      - name: Remove icon references
        run: |
          find project -type f \( -name "AndroidManifest.xml" -o -name "*.xml" \) -print0 | while IFS= read -r -d '' file; do
            sed -i 's/android:icon="@drawable\/rr_motor_icon"//g' "$file"
            sed -i 's/android:icon="@mipmap\/rr_motor_icon"//g' "$file"
            sed -i 's/android:roundIcon="@drawable\/rr_motor_icon"//g' "$file"
            sed -i 's/android:roundIcon="@mipmap\/rr_motor_icon"//g' "$file"
          done

          find project -type f -name "rr_motor_icon.png" -delete

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RR-MOTOR-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
