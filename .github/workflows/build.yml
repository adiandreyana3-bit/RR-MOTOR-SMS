name: Build APK RR MOTOR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o RR_MOTOR_COMPLETE.zip -d project

      - name: Add SMS permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.SEND_SMS" />',
              '    <uses-permission android:name="android.permission.READ_SMS" />',
              '    <uses-permission android:name="android.permission.RECEIVE_SMS" />'
          ]

          marker = '<application'
          additions = '\n'.join(permissions) + '\n'

          if 'android.permission.SEND_SMS' not in text:
              text = text.replace(marker, additions + marker, 1)

          p.write_text(text)
          PY

      - name: Find Kotlin and Java files
        run: |
          echo "===== FILE KOTLIN ====="
          find project -type f -name "*.kt" -print

          echo ""
          echo "===== FILE JAVA ====="
          find project -type f -name "*.java" -print

      - name: Show Android Manifest
        run: |
          echo "===== ANDROID MANIFEST ====="
          cat project/app/src/main/AndroidManifest.xml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RR-MOTOR-APK
          path: project/**/build/outputs/apk/debug/*.apk
