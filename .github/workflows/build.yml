      # =========================================================
      # 18. BUAT GRADLE WRAPPER
      #
      # Ini yang memperbaiki error:
      # "gradlew: No such file or directory"
      # =========================================================
      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -e

          gradle wrapper \
            --gradle-version 8.10.2 \
            --distribution-type bin

          chmod +x gradlew

          test -f gradlew

          echo "Gradle Wrapper berhasil dibuat."


      # =========================================================
      # 19. BUILD APK
      # =========================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          ./gradlew clean

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 20. SIAPKAN APK
      # =========================================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)


          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi


          cp "$APK" \
            release/RR-MOTOR-FINAL-APK.apk


          echo "APK berhasil dibuat:"
          ls -lh release/RR-MOTOR-FINAL-APK.apk


      # =========================================================
      # 21. UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RR-MOTOR-FINAL-APK
          path: release/RR-MOTOR-FINAL-APK.apk
          if-no-files-found: error
          retention-days: 30
