      # ==========================================================
      # 19. BUILD
      # ==========================================================

      - name: Build APK
        shell: bash
        run: |

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleDebug --no-daemon


      # ==========================================================
      # 20. CARI APK
      # ==========================================================

      - name: Find APK
        shell: bash
        run: |

          echo "========== APK =========="

          find . \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================================
      # 21. SIAPKAN APK
      # ==========================================================

      - name: Prepare final APK
        shell: bash
        run: |

          mkdir -p release

          APK=$(find \
            app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)


          if [ -z "$APK" ]; then

              echo "APK TIDAK DITEMUKAN"

              exit 1

          fi


          cp "$APK" \
            release/RR-MOTOR-FINAL-APK.apk


          ls -lh release/


      # ==========================================================
      # 22. UPLOAD
      # ==========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: RR-MOTOR-FINAL-APK

          path: release/RR-MOTOR-FINAL-APK.apk

          if-no-files-found: error

          retention-days: 30
