name: Build APK RR MOTOR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o RR_MOTOR_COMPLETE.zip -d project

      - name: Fix SMS permission and runtime request
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("project/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.SEND_SMS"/>'

          if 'android.permission.SEND_SMS' not in text:
              text = text.replace('<application', permission + '\n    <application', 1)

          manifest.write_text(text)

          activity = Path("project/app/src/main/java/com/rrmotor/sms/MainActivity.java")
          text = activity.read_text()

          text = text.replace(
              'if(checkSelfPermission(Manifest.permission.SEND_SMS)!=PackageManager.PERMISSION_GRANTED) requestPermissions(new String[]{Manifest.permission.SEND_SMS},10);',
              '''if (android.os.Build.VERSION.SDK_INT >= 23 &&
                  checkSelfPermission(Manifest.permission.SEND_SMS) != PackageManager.PERMISSION_GRANTED) {
                  requestPermissions(
                      new String[]{Manifest.permission.SEND_SMS},
                      10
                  );
              }'''
          )

          activity.write_text(text)
          PY

      - name: Show SMS configuration
        run: |
          echo "===== MANIFEST ====="
          cat project/app/src/main/AndroidManifest.xml
          echo ""
          echo "===== MAIN ACTIVITY ====="
          cat project/app/src/main/java/com/rrmotor/sms/MainActivity.java

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RR-MOTOR-APK
          path: project/**/build/outputs/apk/debug/*.apk
